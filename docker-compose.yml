services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:$SERVER_PORT:$SERVER_PORT

  searcher:
    build:
      context: .
      dockerfile: ./searcher/Dockerfile
    restart: unless-stopped
    env_file: .env
    init: true
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  resolver:
    build:
      context: .
      dockerfile: ./resolver/Dockerfile
    restart: unless-stopped
    env_file: .env
    init: true
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifier:
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - 127.0.0.1:$CLIENT_SERVER_PORT:3000

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=$DATABASE_NAME
      - POSTGRES_USER=$DATABASE_USER
      - POSTGRES_PASSWORD=$DATABASE_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:$DATABASE_PORT:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DATABASE_USER -d $DATABASE_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "$REDIS_PASSWORD",
          "--no-auth-warning",
          "ping",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    restart: unless-stopped
    environment:
      - DD_API_KEY=$DD_API_KEY
      - DD_SITE=datadoghq.eu
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_INCLUDE=name:resolver name:searcher name:server name:notifier
      - DD_CONTAINER_EXCLUDE=name:datadog-agent name:db name:redis
      - DD_ENABLE_PAYLOADS_EVENTS=false
      - DD_ENABLE_PAYLOADS_SERIES=false
      - DD_ENABLE_PAYLOADS_SERVICE_CHECKS=false
      - DD_ENABLE_PAYLOADS_SKETCHES=false
      - DD_APM_ENABLED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc/:/host/proc/:ro
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - client
      - server

volumes:
  db_data:
    external: false
  redis_data:
    external: false
